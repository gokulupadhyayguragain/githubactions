name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://mini-bank.pages.dev
          NEXT_RUNTIME: nodejs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mini-bank
          directory: .output
          wranglerConfigPath: wrangler.toml
          vars: |
            {"GOOGLE_CLIENT_ID":"${{ secrets.GOOGLE_CLIENT_ID }}","GOOGLE_CLIENT_SECRET":"${{ secrets.GOOGLE_CLIENT_SECRET }}","NEXTAUTH_SECRET":"${{ secrets.NEXTAUTH_SECRET }}","NEXTAUTH_URL":"https://mini-bank.pages.dev"}

      - name: Comment Deployment URL
        if: github.event_name == 'push'
        run: |
          echo "🎉 Deployed to Cloudflare Pages!"
          echo "URL: https://mini-bank.pages.dev"