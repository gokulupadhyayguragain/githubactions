name: Daily Report

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Generate and Send Report
        run: node githubactions/scripts/generate-report.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BANK_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BANK_CF_ID }}
          D1_DATABASE_ID: ${{ secrets.BANK_D1_ID }}
          RESEND_API_KEY: ${{ secrets.USER_RESEND_KEY }}
          REPORT_EMAIL: ${{ secrets.USER_RESEND_EMAIL }}