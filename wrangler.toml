name = "mini-bank"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Pages Functions are auto-detected in the functions/ directory
# They are served from the same domain as the Pages site

[[d1_databases]]
binding = "DB"
database_name = "mini-bank"
database_id = "82f17137-672a-4dba-b694-df0fb8f21a09"

[[r2_buckets]]
binding = "mini_bank_reports"
bucket_name = "mini-bank-reports"

[vars]
APP_NAME = "Mini Bank"
NEXTAUTH_URL = "https://mini-bank.pages.dev"

[build]
command = "npm run build"
pages_build_output_dir = ".next"

[[pages.functions]]
src = "functions/*"
name = "functions"