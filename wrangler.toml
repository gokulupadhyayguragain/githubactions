name = "mini-bank"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".output"

[[d1_databases]]
binding = "DB"
database_name = "mini-bank"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "mini-bank-reports"

[vars]
APP_NAME = "Mini Bank"
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
NEXTAUTH_SECRET = ""
NEXTAUTH_URL = "https://mini-bank.pages.dev"

[secrets]
GOOGLE_CLIENT_ID
GOOGLE_CLIENT_SECRET
NEXTAUTH_SECRET