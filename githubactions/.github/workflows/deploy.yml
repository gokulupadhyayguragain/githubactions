name: Deploy Note App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.USER_CF_TOKEN }}
          accountId: ${{ secrets.USER_CF_ID }}
          command: deploy